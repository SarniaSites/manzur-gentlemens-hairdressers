<!doctype html>
<html lang="en-GB" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thanks | Manzur Gentlemens Hairdressers</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171514">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.replace('no-js','js');</script>
</head>
<body class="on-dark bg-ink text-paper">
<svg width="0" height="0" class="absolute" aria-hidden="true"><defs>
  <symbol id="cord" viewBox="0 0 200 120"><g fill="none" stroke-linecap="round"><path d="M100 14 L16 116 M100 14 L184 116" stroke="#e9e5df" stroke-width="2.2"/><ellipse cx="100" cy="9" rx="11" ry="7.5" fill="rgba(233,229,223,.25)" stroke="#e9e5df" stroke-width="1.6"/><circle cx="100" cy="14" r="2.6" fill="#e9e5df"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 3.5h3.2l1.6 4.2-2.1 1.4a11 11 0 0 0 7.2 7.2l1.4-2.1 4.2 1.6V19a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.7 2 2 0 0 1 5 3.5Z"/></symbol>
</defs></svg>
<main class="relative flex min-h-[100svh] flex-col overflow-hidden">
  <header class="wrap py-6"><a href="./" class="inline-block"><img src="images/brand/wordmark-light.svg" alt="Manzur Gentlemens Hairdressers" width="190" height="48" class="h-10 w-auto sm:h-11"></a></header>
  <img src="images/brand/mark-light.svg" alt="" width="1520" height="970" class="pointer-events-none absolute -right-[10%] bottom-[-6%] w-[80%] max-w-none opacity-[0.06] sm:w-[60%]" aria-hidden="true">
  <div class="wrap relative flex flex-1 flex-col justify-center pb-24 pt-4">
    <div class="mb-10">
      <div class="hanger swing" style="--swing-amp:2.6deg;--swing-dur:5.2s">
        <svg class="hanger-cord h-20 w-[170px]" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true"><use href="#cord"/></svg>
        <button type="button" class="sign -mt-1 h-[96px] w-[240px]" data-sign aria-label="Shop sign: tap to turn it over">
          <span class="sign-inner h-full w-full">
            <span class="sign-face front"><span class="word text-[2.2rem]">SEE YOU</span><span class="sub mt-1 text-[1rem]">at No. 1</span></span>
            <span class="sign-face back"><span class="word text-[2.2rem]">BOOKING</span><span class="sub mt-1 text-[1rem]">Tue to Sat</span></span>
          </span>
        </button>
      </div>
    </div>
    <h1 class="max-w-[16ch] font-display uppercase leading-[0.86]" style="font-size:clamp(3.4rem,8vw,7rem);font-weight:900">Thanks, that's with us</h1>
    <p class="mt-6 max-w-[34rem] text-[1.1rem] text-paper/80">We'll ring you back to fix a day and time. If it's urgent, call the shop on 01481 712220, Tuesday to Saturday.</p>
    <div class="mt-8 flex flex-wrap gap-3">
      <a href="./" class="btn btn-action">Back to the site</a>
      <a href="tel:+441481712220" class="btn btn-line"><svg aria-hidden="true"><use href="#i-phone"/></svg>01481 712220</a>
    </div>
  </div>
  <div class="pole turn h-[12px]" aria-hidden="true"></div>
</main>
<script>document.addEventListener('click',function(e){var s=e.target.closest('[data-sign]');if(s)s.classList.toggle('is-flipped')});</script>
</body>
</html>
